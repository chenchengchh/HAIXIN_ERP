spring:
  application:
    name: scada-service
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: localhost:8848
      config:
        enabled: true
        server-addr: localhost:8848
        import-check:
          enabled: false
  config:
    import: optional:nacos:localhost:8848

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/scada_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:scada_app}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect

  # 字符集配置
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

server:
  port: 8086
  # Servlet 编码配置：强制 HTTP 请求与响应统一使用 UTF-8 字符集，防止中文乱码
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hxcoe.scada.entity
