server:
  port: 8087
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true
      force-request: true
    tomcat:
      uri-encoding: UTF-8
  shutdown: graceful

spring:
  application:
    name: aps-service
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: localhost:8848
      config:
        enabled: true
        server-addr: localhost:8848
        file-extension: yml
        group: DEFAULT_GROUP
        import-check:
          enabled: false
  config:
    import: optional:nacos:localhost:8848
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/aps_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:aps_app}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
      pool-name: APSHikariCP
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    open-in-view: false
    # 延迟数据源初始化：确保Hibernate根据实体建表后再执行data.sql种子数据
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        connection.characterEncoding: UTF-8
        connection.useUnicode: true
        connection.charSet: UTF-8
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
        generate_statistics: false
  sql:
    init:
      # 始终执行初始化脚本；data.sql使用INSERT IGNORE保证幂等，重启不会重复插入
      mode: always
      encoding: UTF-8
      continue-on-error: true
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
  mvc:
    contentnegotiation:
      favor-parameter: false
      favor-path-extension: true
      default-media-type: application/json
    media-types:
      json: application/json;charset=UTF-8
      yaml: text/yaml
      yml: text/yaml
      xml: application/xml
      xhtml: application/xhtml+xml
      html: text/html
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

info:
  app:
    name: aps-service
    version: 1.0.0-SNAPSHOT
    description: 生产计划排程系统

logging:
  level:
    com.hxcoe.aps: info
    org.springframework.web: info
    org.springframework.transaction: info
    org.hibernate: info
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/aps-service.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 100MB
  logback:
    rollingpolicy:
      file-name-pattern: logs/aps-service.%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 100MB
