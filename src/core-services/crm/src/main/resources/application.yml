server:
  port: 8086
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: crm-service
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: nacos:8848
      config:
        enabled: true
        server-addr: nacos:8848
  config:
    import: optional:nacos:nacos:8848
  # 字符集配置
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
  # Jackson配置：LocalDateTime序列化为ISO字符串，避免输出日期数组
  jackson:
    default-property-inclusion: NON_NULL
    time-zone: Asia/Shanghai
    locale: zh_CN
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/crm_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:crm_app}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        connection.characterEncoding: UTF-8
        connection.useUnicode: true
        connection.charSet: UTF-8
    database-platform: org.hibernate.dialect.MySQLDialect

# 日志配置
logging:
  level:
    com.hxcoe.crm: info
    org.springframework.web: info
    org.springframework.transaction: info
    org.hibernate: info
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/crm-service.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 100MB
  logback:
    rollingpolicy:
      file-name-pattern: logs/crm-service.%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 100MB

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

# CRM模块配置
crm:
  # 客户管理配置
  customer:
    default-category: GENERAL
    credit-limit: 100000.00
  # 销售管理配置
  sales:
    default-discount-rate: 0.0
    follow-up-reminder-days: 7
  # 服务管理配置
  service:
    default-sla-hours: 48
    escalation-hours: 24
  # 商机管理配置
  opportunity:
    default-probability: 50
    stages: LEAD,QUALIFY,PROPOSAL,NEGOTIATE,CLOSE_WON,CLOSE_LOST
