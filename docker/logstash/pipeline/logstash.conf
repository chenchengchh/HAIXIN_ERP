# Logstash配置文件
# 输入配置
input {
  # 从文件读取日志
  file {
    path => ["/var/log/system/*.log"]
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "system_log"
  }
  
  # 接收Beats数据
  beats {
    port => 5044
  }
  
  # 接收HTTP请求
  http {
    port => 8080
    codec => json
  }
}

# 过滤配置
filter {
  if [type] == "system_log" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:loglevel} \[%{DATA:thread}\] %{DATA:class} - %{GREEDYDATA:message}"
      }
    }
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
  
  # JSON日志解析
  if [message] =~ /^{.*}$/ {
    json {
      source => "message"
    }
  }
}

# 输出配置
output {
  # 输出到Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "system-logs-%{+YYYY.MM.dd}"
  }
  
  # 输出到控制台
  stdout {
    codec => rubydebug
  }
}