version: '3.8'

services:
  # 基础设施服务
  redis:
    image: redis:7.0
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=
    volumes:
      - ./docker/redis/data:/data
      - ./docker/redis/conf:/usr/local/etc/redis
    restart: always
    networks:
      - hxcoe-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      - MODE=standalone
      - JVM_XMS=512m
      - JVM_XMX=512m
      - NACOS_AUTH_ENABLE=false
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    restart: always
    networks:
      - hxcoe-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8848/nacos/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hxcoe003
      # 确保数据库使用utf8mb4字符集（推荐使用utf8mb4，支持完整Unicode）
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      # 暂时注释掉数据文件挂载，让MySQL容器自动创建初始数据
      # - ./docker/mysql/data:/var/lib/mysql
      # 配置文件挂载到项目目录
      - ./docker/mysql/config:/etc/mysql/conf.d
      # 日志文件挂载到项目目录
      - ./docker/mysql/logs:/var/log/mysql
      # 初始化脚本挂载
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      # 备份目录挂载
      - ./docker/mysql/backups:/backups
      # 备份脚本挂载
      - ./docker/mysql/backup.sh:/usr/local/bin/backup.sh
      - ./docker/mysql/manual_backup.sh:/usr/local/bin/manual_backup.sh
    restart: always
    networks:
      - hxcoe-network
    command:
      # 设置服务器默认字符集为utf8mb4
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 设置客户端连接默认字符集为utf8mb4
      - --character-set-client-handshake=FALSE
      - --init_connect=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      # 其他配置
      - --default-authentication-plugin=mysql_native_password
      - --max_allowed_packet=256M
      - --max_connections=500
      - --init-file=/docker-entrypoint-initdb.d/99-reseed-plm.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # APS服务
  aps:
    build:
      context: ./src/core-services/aps
      dockerfile: Dockerfile
    container_name: hxcoe003-aps
    ports:
      - "8087:8087"
    restart: always
    depends_on:
      mysql:
        condition: service_healthy  # 等待MySQL健康检查通过
      nacos:
        condition: service_healthy  # 等待Nacos健康检查通过
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_APPLICATION_NAME=aps-service
      # JVM配置
      - JVM_XMS=256m
      - JVM_XMX=512m
      # 数据库配置
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/aps_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=aps_app
      - SPRING_DATASOURCE_PASSWORD=root
      # 数据库连接信息（用于启动脚本）
      - DB_HOST=mysql
      - DB_HOST_PORT=3306
      # Nacos配置
      - SPRING_CLOUD_NACOS_DISCOVERY_ENABLED=true
      - SPRING_CLOUD_NACOS_CONFIG_ENABLED=false
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_FILE_EXTENSION=yaml
      - SPRING_CLOUD_NACOS_CONFIG_GROUP=DEFAULT_GROUP
      - SPRING_CLOUD_NACOS_CONFIG_IMPORT_CHECK_ENABLED=false
      - SPRING_CONFIG_IMPORT=optional:nacos:nacos:8848
    networks:
      - hxcoe-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

